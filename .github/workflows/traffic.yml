name: Archive repository traffic

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Prepare archive branch
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git worktree add --detach "$RUNNER_TEMP/traffic-stats" HEAD
          if git show-ref --verify --quiet refs/remotes/origin/traffic-stats; then
            git -C "$RUNNER_TEMP/traffic-stats" switch --track -c traffic-stats origin/traffic-stats
          else
            git -C "$RUNNER_TEMP/traffic-stats" switch --orphan traffic-stats
          fi
      - name: Collect and merge traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 tools/traffic/collect.py "$RUNNER_TEMP/traffic-stats/traffic.json"
      - name: Commit changes
        shell: bash
        run: |
          cd "$RUNNER_TEMP/traffic-stats"
          git add traffic.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update traffic statistics'
            git push origin HEAD:refs/heads/traffic-stats
          fi
